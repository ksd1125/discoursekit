name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black isort
      - run: ruff check discoursekit/ tests/
      - run: black --check discoursekit/ tests/
      - run: isort --check-only discoursekit/ tests/
