[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discoursekit"
version = "0.1.0"
description = "Academic-grade news and social discourse analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["discourse analysis", "NLP", "news", "academic", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit>=1.36",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "plotly>=5.0",
    "statsmodels>=0.14",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
]

[project.scripts]
discoursekit = "discoursekit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["discoursekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
